[package]
name = "mimlesek"
version = "2.1.0"
description = "Mimlesek: kişisel mim defteri"
authors = ["Görkem Güler"]
license = "MIT"
repository = "https://github.com/gorkemguler/mimlesek"
edition = "2021"
rust-version = "1.77.2"

[lib]
# Android için paylaşılan kütüphane, masaüstü için normal kütüphane olarak derlenir.
name = "mimlesek_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
