name: Sahaya sür

# main dalına her gönderimde testler koşar; geçerse site GitHub Pages'e yayınlanır.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Güvenlik taraması (testler)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm test
      - run: npm run build

  deploy:
    name: Operasyon (GitHub Pages)
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Web paketini ve tek dosya sürümünü derle
        run: |
          npm run web
          npm run build
      - name: Siteyi topla
        run: |
          mkdir -p _site/docs
          cp -r dist/web/. _site/
          cp docs/*.png _site/docs/
          cp dist/mimlesek.html _site/mimlesek-tek-dosya.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
